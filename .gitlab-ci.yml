    - make -C test/pipeline_key clean
    - SANITIZER=address,undefined ./test/pipeline_key/run_tests.sh
    - make -C test/pipeline_key clean
    - SANITIZER=thread ./test/pipeline_key/run_tests.sh

# A thread ended from deep inside what it runs, as the GPU thread ends on a
# close, linked as the core links its C++ runtime (statically): every
# destructor runs and nothing aborts; plain, under ASan + UBSan, and sixteen
# threads at once under TSan.
test-thread-exit:
  stage: test
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-amd64-ubuntu:backports
  needs: []
  variables:
    CC: gcc-12
    CXX: g++-12
  script:
    - ./test/thread_exit/run_tests.sh
    - make -C test/thread_exit clean
    - SANITIZER=address,undefined ./test/thread_exit/run_tests.sh
    - make -C test/thread_exit clean
    - SANITIZER=thread ./test/thread_exit/run_tests.sh

# Pipelines made ahead of the draw or copy that needs them (the surface
# copies'), on compile threads: a take after them builds nothing, takes racing
# them get each built once; plain, under ASan + UBSan, and under TSan.
test-prepared-pipeline:
  stage: test
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-amd64-ubuntu:backports
  needs: []
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: dependencies/Vulkan-Headers
    CC: gcc-12
    CXX: g++-12
  script:
    - ./test/prepared_pipeline/run_tests.sh
    - make -C test/prepared_pipeline clean
    - SANITIZER=address,undefined ./test/prepared_pipeline/run_tests.sh
    - make -C test/prepared_pipeline clean
    - SANITIZER=thread ./test/prepared_pipeline/run_tests.sh

# Register states from a seed drawn on lavapipe with the state the draw can
