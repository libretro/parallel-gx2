name: Build libretro core

# Builds parallel_gx2_libretro with the Makefile for every target the core
# currently supports and uploads each result as an artifact, so a release
# can be assembled from them. The dependencies are submodules built with
# the core, so a job installs no libraries at all - not even GL or X11
# headers, as the context, surface and swapchain are the frontend's. Also
# runs the network layer's, the OpenGL GPU cothread's, the thread
# handoffs', the Wii U archive reader's and the shader compiler's tests.

on:
  push:
    branches:
      - libretro
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, comma-separated (linux, windows, android, macos), or all'
        type: string
        default: all

# Test builds can be limited to the platforms their testers use: the
# platforms input (workflow_dispatch) lists them. Pushes and "all" build
# everything.
jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Install dependencies"
        # the compiler, and nothing else
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends g++-12

      - name: "Build"
        run: make -j $(nproc) CC=gcc-12 CXX=g++-12

      - name: "No GL, EGL or X11 linked"
        # the context and every GL function are the frontend's
        run: ./tools/check_core_imports.sh parallel_gx2_libretro.so

      - name: "Every source file used"
        # each of the core's own objects reached from the retro_* entry
        # points, none kept alive only by work at load time
        run: ./tools/check_unused_units.sh obj/unix-*

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        with:
          name: parallel_gx2_libretro-linux-${{ matrix.arch }}
          path: ./parallel_gx2_libretro.so

  tests:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    name: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6

      - name: "No window-system code"
        # no X11/XCB/Wayland/GL/EGL header, VK_USE_PLATFORM_* or surface entry
        # point in the core: the frontend owns the context and the surface
        run: ./tools/check_no_wsi.sh

      - name: "Pipelines from the state they are handed"
        # no live GPU registers read where a pipeline is built or keyed: one
        # loaded from the cache on a compile thread baked in the depth,
        # stencil and clip state the GPU thread was drawing with
        run: ./tools/check_pipeline_registers.sh

      - name: "No absolute paths written for the compiler"
        # MSYS2's make makes /c/... paths, which MinGW's g++ cannot open
        # inside a file (the precompiled header's stub broke the Windows build)
        run: ./tools/check_build_paths.sh

      - name: "A clone without submodules builds"
        # make fetches them, where the build used to stop at glm/glm.hpp
        run: ./tools/check_submodule_fetch.sh

      - name: "No settings file"
        # the core's settings come from Cemu's defaults and the core
        # options: no settings.xml read or written, nothing kept that only
        # it could switch on
        run: ./tools/check_no_settings_file.sh

      - name: "Unused source files found"
        # the check the Linux builds run on their objects, against a tree
        # whose answer is known
        run: ./test/unused_units/run_tests.sh

      - name: "Controllers updated once a frame"
        # from retro_run, after the frontend's input is polled: no input
        # thread waking every millisecond to update them
        run: ./tools/check_input_per_frame.sh

      - name: "GPU thread waits woken, not timed or spun"
        # an idle GPU thread sleeps until the CPU submits; the GPU thread's
        # start, the title start, the graphic packs, the GPU's init, GX2Init
        # and the IOSU services' threads sleep until notified, not by the
        # clock; nor is the pause gate a mutex any more; context_destroy's
        # waits for the GPU thread and the Audio Thread's empty pulls too;
        # the title scan, IOSU shutdown, SpotPass and nim waits as well;
        # and log.txt, the Vulkan queue lock and the motion and rumble
        # handoffs take no lock, nor AX's use of the audio devices, guest
        # time reads, the CPU's data cache flush reports, or the Vulkan
        # pipeline cache's compile threads, the worker queues or the shader
        # compile pool, the emulated controllers' reads, the IOSU ioctl
        # queues, the IOSU kernel's IPC or the shader cache writer; nor does
        # the nex thread poll
        run: ./tools/check_gpu_waits.sh

      - name: "HTTP transfers against local servers"
        # the core's transfers (http_xfer.c) and nlibcurl's host side over
        # them (curl_host.c), both C89: plain, then under AddressSanitizer +
        # UBSan, then ThreadSanitizer
        run: |
          ./test/http_xfer/run_tests.sh
          make -C test/http_xfer clean
          SANITIZER=address,undefined ./test/http_xfer/run_tests.sh
          make -C test/http_xfer clean
          SANITIZER=thread ./test/http_xfer/run_tests.sh

      - name: "OpenGL GPU cothread"
        # plain, then under AddressSanitizer + UBSan (ThreadSanitizer does
        # not follow stack switches)
        run: |
          ./test/gpu_cothread/run_tests.sh
          make -C test/gpu_cothread clean
          SANITIZER=address,undefined ./test/gpu_cothread/run_tests.sh

      - name: "Thread handoffs"
        # the recompiler's work queue, the GPU thread's wake, the audio
        # ring: plain, under ThreadSanitizer, under ASan + UBSan
        run: |
          ./test/handoff/run_tests.sh
          make -C test/handoff clean
          SANITIZER=thread ./test/handoff/run_tests.sh
          make -C test/handoff clean
          SANITIZER=address,undefined ./test/handoff/run_tests.sh

      - name: "Screen layouts and video views"
        # Both Screens' packing, the layout a frame is drawn with and the
        # views map that describes it: plain, then under ASan + UBSan
        run: |
          ./test/video_views/run_tests.sh
          make -C test/video_views clean
          SANITIZER=address,undefined ./test/video_views/run_tests.sh

      - name: "Audio arithmetic"
        # the 5.1 downmix's rounding and the GamePad's sound paired with the
        # TV's frames: plain, then under ASan + UBSan
        run: |
          ./test/audio_mix/run_tests.sh
          make -C test/audio_mix clean
          SANITIZER=address,undefined ./test/audio_mix/run_tests.sh

      - name: "Vulkan negotiation"
        # the device the core makes for the frontend: version 2 through the
        # frontend's wrapper (how it adds Reflex's extensions), version 1 for
        # a frontend without it; on lavapipe, plain then under ASan + UBSan
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm dependencies/Vulkan-Headers
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          VN_REQUIRE_DEVICE=1 ./test/vknegotiate/run_tests.sh
          make -C test/vknegotiate clean
          VN_REQUIRE_DEVICE=1 SANITIZER=address,undefined ./test/vknegotiate/run_tests.sh

      - name: "Vulkan pipeline key"
        # state the pipelines take as dynamic state makes no new pipeline,
        # and everything a pipeline bakes in still does; the pipeline
        # library parts' keys and their lock-free cache: plain, under ASan +
        # UBSan, and the cache's threads under TSan. The core's precompiled
        # header wants fmt and glm, the state the draw sets the Vulkan headers.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm dependencies/Vulkan-Headers
          ./test/pipeline_key/run_tests.sh
          make -C test/pipeline_key clean
          SANITIZER=address,undefined ./test/pipeline_key/run_tests.sh
          make -C test/pipeline_key clean
          SANITIZER=thread ./test/pipeline_key/run_tests.sh

      - name: "Thread exit"
        # a thread ended from deep inside what it runs, as the GPU thread
        # ends on a close, linked as the core links its C++ runtime
        # (statically): every destructor runs and nothing aborts; plain,
        # under ASan + UBSan, and sixteen threads at once under TSan
        run: |
          ./test/thread_exit/run_tests.sh
          make -C test/thread_exit clean
          SANITIZER=address,undefined ./test/thread_exit/run_tests.sh
          make -C test/thread_exit clean
          SANITIZER=thread ./test/thread_exit/run_tests.sh

      - name: "Prepared pipelines"
        # pipelines made ahead of the draw or copy that needs them (the
        # surface copies'), on compile threads: a take after them builds
        # nothing, takes racing them get each built once; plain, under ASan +
        # UBSan, and under TSan
        run: |
          git submodule update --init --depth 1 dependencies/Vulkan-Headers
          ./test/prepared_pipeline/run_tests.sh
          make -C test/prepared_pipeline clean
          SANITIZER=address,undefined ./test/prepared_pipeline/run_tests.sh
          make -C test/prepared_pipeline clean
          SANITIZER=thread ./test/prepared_pipeline/run_tests.sh

      - name: "Dynamic state drawn"
        # register states from a seed drawn on lavapipe with the state the
        # draw can set baked into the pipeline, left to the draw, and linked
        # from graphics pipeline libraries: the pictures match to the byte;
        # plain, under ASan + UBSan, and under the Khronos validation layer,
        # where any error fails
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm dependencies/Vulkan-Headers
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
          VN_REQUIRE_DEVICE=1 ./test/dynstate/run_tests.sh
          make -C test/dynstate clean
          VN_REQUIRE_DEVICE=1 SANITIZER=address,undefined ./test/dynstate/run_tests.sh
          make -C test/dynstate clean
          VN_REQUIRE_DEVICE=1 VN_VALIDATE=1 ./test/dynstate/run_tests.sh

      - name: "XML"
        # the core's XML layer over libretro-common's rxml and the settings
        # files on it: plain, then under ASan + UBSan. The core's precompiled
        # header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/xml/run_tests.sh
          make -C test/xml clean
          SANITIZER=address,undefined ./test/xml/run_tests.sh

      - name: "Error viewer"
        # erreula's dialog as the frontend's message and its answer from the
        # game's controllers: plain, then under ASan + UBSan
        run: |
          ./test/erreula/run_tests.sh
          make -C test/erreula clean
          SANITIZER=address,undefined ./test/erreula/run_tests.sh

      - name: "H.264 decoder"
        # h264.rpl's decoder engine over rh264 and a frontend's decoder,
        # against ffmpeg's pictures of test/h264/streams: plain, under
        # ThreadSanitizer, under ASan + UBSan. The core's precompiled header
        # wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/h264/run_tests.sh
          make -C test/h264 clean
          SANITIZER=thread ./test/h264/run_tests.sh
          make -C test/h264 clean
          SANITIZER=address,undefined ./test/h264/run_tests.sh

      - name: "Wii U archives"
        # the core's .wua reader over libretro-common's zar, against archives
        # zar's writer makes: plain, under ThreadSanitizer, under ASan + UBSan.
        # The core's precompiled header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/zarchive/run_tests.sh
          make -C test/zarchive clean
          SANITIZER=thread ./test/zarchive/run_tests.sh
          make -C test/zarchive clean
          SANITIZER=address,undefined ./test/zarchive/run_tests.sh

      - name: "Disc images, title content, homebrew bundles"
        # the core's .wud/.wux, .app and .wuhb readers against images made by
        # the test, mapped and not: plain, under ThreadSanitizer, under ASan +
        # UBSan. The core's precompiled header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/disc_image/run_tests.sh
          make -C test/disc_image clean
          SANITIZER=thread ./test/disc_image/run_tests.sh
          make -C test/disc_image clean
          SANITIZER=address,undefined ./test/disc_image/run_tests.sh

      - name: "Disc keys"
        # where the core looks for a disc image's key - keys.txt, read again
        # at each load, and the .key files beside the image - and what it says
        # when none fits: plain, under ThreadSanitizer, under ASan + UBSan.
        # The core's precompiled header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/keycache/run_tests.sh
          make -C test/keycache clean
          SANITIZER=thread ./test/keycache/run_tests.sh
          make -C test/keycache clean
          SANITIZER=address,undefined ./test/keycache/run_tests.sh

      - name: "Virtual file system"
        # the core's file system over host folders mounted as a title and its
        # update: which mount a file comes from, files read in pieces and the
        # RPX hash over them, directories listed through both; plain, under
        # ThreadSanitizer, under ASan + UBSan. The core's precompiled header
        # wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/fsc/run_tests.sh
          make -C test/fsc clean
          SANITIZER=thread ./test/fsc/run_tests.sh
          make -C test/fsc clean
          SANITIZER=address,undefined ./test/fsc/run_tests.sh

      - name: "Title list"
        # the core's list of titles over stand-in titles in a folder: scans,
        # the cache file, a wait for a scan that never misses one, and the
        # list read with no lock while scans change it; plain, under
        # ThreadSanitizer, under ASan + UBSan. The core's precompiled header
        # wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/titlelist/run_tests.sh
          make -C test/titlelist clean
          SANITIZER=thread ./test/titlelist/run_tests.sh
          make -C test/titlelist clean
          SANITIZER=address,undefined ./test/titlelist/run_tests.sh

      - name: "Shared files"
        # the core's file read from many threads at once (C89): mapped and
        # not, its streams kept and lent; plain, under ThreadSanitizer,
        # under ASan + UBSan
        run: |
          ./test/shared_file/run_tests.sh
          make -C test/shared_file clean
          SANITIZER=thread ./test/shared_file/run_tests.sh
          make -C test/shared_file clean
          SANITIZER=address,undefined ./test/shared_file/run_tests.sh

      - name: "AES"
        # the core's AES-128 over libretro-common's crypto (C89): standard
        # vectors, a 64 KiB CBC block against block-by-block, CTR's
        # counter; plain and under ASan + UBSan
        run: |
          ./test/aes/run_tests.sh
          make -C test/aes clean
          SANITIZER=address,undefined ./test/aes/run_tests.sh

      - name: "Lock-free cell"
        # the C under RcuCell.h (C89): readers never see a value freed, a
        # reader not yet counted in when a writer moves on, writers in turn;
        # plain, under ThreadSanitizer, under ASan + UBSan
        run: |
          ./test/rcu_cell/run_tests.sh
          make -C test/rcu_cell clean
          SANITIZER=thread ./test/rcu_cell/run_tests.sh
          make -C test/rcu_cell clean
          SANITIZER=address,undefined ./test/rcu_cell/run_tests.sh

      - name: "Whole-file reads"
        # the C (C89) under MappedFile.h: files lent from their mapping and,
        # built without mappings, read once; missing, empty, a directory, one
        # replaced under its name while open; plain and under ASan + UBSan
        run: |
          ./test/mapped_file/run_tests.sh
          make -C test/mapped_file clean
          SANITIZER=address,undefined ./test/mapped_file/run_tests.sh

      - name: "Disc images and title folders"
        # the C (C89) volumes are opened from them with: a disc image and a
        # title folder made here, opened, and turned away in each way one
        # can be wrong; tickets and TMDs; plain and under ASan + UBSan
        run: |
          ./test/fst_open/run_tests.sh
          make -C test/fst_open clean
          SANITIZER=address,undefined ./test/fst_open/run_tests.sh

      - name: "Title files"
        # the C (C89) a title's meta.xml, meta.ini, app.xml and cos.xml are
        # parsed in, each number and name as the C++ readers before it took
        # them; plain and under ASan + UBSan
        run: |
          ./test/title_xml/run_tests.sh
          make -C test/title_xml clean
          SANITIZER=address,undefined ./test/title_xml/run_tests.sh

      - name: "Ini files"
        # the C (C89) rules.txt, game profiles and a WUHB's meta.ini are read
        # with, and the C++ walk over it; plain and under ASan + UBSan
        run: |
          ./test/ini_file/run_tests.sh
          make -C test/ini_file clean
          SANITIZER=address,undefined ./test/ini_file/run_tests.sh

      - name: "HMAC-MD5"
        # the C (C89) NEX signs packets and tickets with, over
        # libretro-common's MD5: RFC test vectors, a MAC in pieces, long keys
        # cut; plain and under ASan + UBSan
        run: |
          ./test/hmac_md5/run_tests.sh
          make -C test/hmac_md5 clean
          SANITIZER=address,undefined ./test/hmac_md5/run_tests.sh

      - name: "Memory streams"
        # the C (C89) the shader, pipeline and register caches and graphic
        # pack patch files are read and written with; plain and under
        # ASan + UBSan
        run: |
          ./test/mem_stream/run_tests.sh
          make -C test/mem_stream clean
          SANITIZER=address,undefined ./test/mem_stream/run_tests.sh

      - name: "zlib streams"
        # the C (C89) games' and the core's zlib streams go through, with
        # eight threads sharing its pool of inflaters; plain, under TSan and
        # under ASan + UBSan
        run: |
          ./test/zlib_stream/run_tests.sh
          make -C test/zlib_stream clean
          SANITIZER=thread ./test/zlib_stream/run_tests.sh
          make -C test/zlib_stream clean
          SANITIZER=address,undefined ./test/zlib_stream/run_tests.sh

      - name: "Cache files"
        # the C (C89) the shader, pipeline and graphic pack caches are kept
        # in, from the inside: its index, its free space, its file table's
        # growth, files reopened, V2 files and broken entries; plain, under
        # TSan and under ASan + UBSan
        run: |
          ./test/file_cache/run_tests.sh
          make -C test/file_cache clean
          SANITIZER=thread ./test/file_cache/run_tests.sh
          make -C test/file_cache clean
          SANITIZER=address,undefined ./test/file_cache/run_tests.sh

      - name: "Host paths"
        # the C (C89) paths are matched without regard to case with, and
        # trees removed with; plain and under ASan + UBSan
        run: |
          ./test/host_path/run_tests.sh
          make -C test/host_path clean
          SANITIZER=address,undefined ./test/host_path/run_tests.sh

      - name: "Title detection"
        # the C (C89) a file or folder is told a title by, from its name or
        # its first octets; plain and under ASan + UBSan
        run: |
          ./test/title_detect/run_tests.sh
          make -C test/title_detect clean
          SANITIZER=address,undefined ./test/title_detect/run_tests.sh

      - name: "Host folder files"
        # the C (C89) a title's host folder is read and written through,
        # under the virtual file system's host device; plain and under
        # ASan + UBSan
        run: |
          ./test/host_fs/run_tests.sh
          make -C test/host_fs clean
          SANITIZER=address,undefined ./test/host_fs/run_tests.sh

      - name: "GamePad rumble"
        # the C (C89) VPADControlMotor's patterns are queued and played in,
        # with no lock and nothing allocated; plain, under TSan and under
        # ASan + UBSan
        run: |
          ./test/rumble_queue/run_tests.sh
          make -C test/rumble_queue clean
          SANITIZER=thread ./test/rumble_queue/run_tests.sh
          make -C test/rumble_queue clean
          SANITIZER=address,undefined ./test/rumble_queue/run_tests.sh

      - name: "Camera state"
        # The camera library's handles and surface queues, with no lock: a
        # surface to its own holder's handler only, none across titles;
        # plain, under TSan and under ASan + UBSan
        run: |
          ./test/cam_state/run_tests.sh
          make -C test/cam_state clean
          SANITIZER=thread ./test/cam_state/run_tests.sh
          make -C test/cam_state clean
          SANITIZER=address,undefined ./test/cam_state/run_tests.sh

      - name: "USB device state"
        # nsyshid's devices, clients and transfer workers, with no lock: a
        # device released once, never while held; plain, under TSan and
        # under ASan + UBSan
        run: |
          ./test/hid_core/run_tests.sh
          make -C test/hid_core clean
          SANITIZER=thread ./test/hid_core/run_tests.sh
          make -C test/hid_core clean
          SANITIZER=address,undefined ./test/hid_core/run_tests.sh

      - name: "Async callback queue"
        # coreinit's callbacks queued from any thread and taken by its
        # callback thread, with no lock; plain, under TSan and under ASan + UBSan
        run: |
          ./test/async_cb/run_tests.sh
          make -C test/async_cb clean
          SANITIZER=thread ./test/async_cb/run_tests.sh
          make -C test/async_cb clean
          SANITIZER=address,undefined ./test/async_cb/run_tests.sh

      - name: "Curl transfer threads"
        # nlibcurl's transfers on a fixed set of host threads, a stopped
        # title's jobs retired, with no lock; plain, under TSan and under ASan + UBSan
        run: |
          ./test/curl_jobs/run_tests.sh
          make -C test/curl_jobs clean
          SANITIZER=thread ./test/curl_jobs/run_tests.sh
          make -C test/curl_jobs clean
          SANITIZER=address,undefined ./test/curl_jobs/run_tests.sh

      - name: "Fixed lock-free queue"
        # the ring under GX2's events, IOS timers and requests, thread
        # deallocators and the pipeline cache writer; plain, under TSan and
        # under ASan + UBSan
        run: |
          ./test/lf_ring/run_tests.sh
          make -C test/lf_ring clean
          SANITIZER=thread ./test/lf_ring/run_tests.sh
          make -C test/lf_ring clean
          SANITIZER=address,undefined ./test/lf_ring/run_tests.sh

      - name: "Trap instructions"
        # tw run through the interpreter goes on to the next instruction:
        # it once called a GDB stub the core never makes, or ran forever;
        # plain and under ASan + UBSan
        run: |
          ./test/ppc_trap/run_tests.sh
          make -C test/ppc_trap clean
          SANITIZER=address,undefined ./test/ppc_trap/run_tests.sh

      - name: "Symbol names"
        # the C (C89) the console's addresses are named in, with no lock:
        # RPL exports and imports, trampolines and graphic pack patches;
        # plain, under TSan and under ASan + UBSan
        run: |
          ./test/rpl_symbols/run_tests.sh
          make -C test/rpl_symbols clean
          SANITIZER=thread ./test/rpl_symbols/run_tests.sh
          make -C test/rpl_symbols clean
          SANITIZER=address,undefined ./test/rpl_symbols/run_tests.sh

      - name: "Base64"
        # the C (C89) Miiverse's and the console services' payloads are
        # encoded and decoded in, decoding as Cemu always has; plain and
        # under ASan + UBSan
        run: |
          ./test/base64/run_tests.sh
          make -C test/base64 clean
          SANITIZER=address,undefined ./test/base64/run_tests.sh

      - name: "eTickets"
        # the C (C89) a DLC's title.tik is read in for the contents it grants,
        # every offset in it checked; plain and under ASan + UBSan
        run: |
          ./test/eticket/run_tests.sh
          make -C test/eticket clean
          SANITIZER=address,undefined ./test/eticket/run_tests.sh

      - name: "Offline Miiverse posts"
        # the C (C89) a post's memo and picture are read from OfflineDB.zar
        # in, and the posts picked; plain, under TSan and under ASan + UBSan
        run: |
          ./test/olv_offline/run_tests.sh
          make -C test/olv_offline clean
          SANITIZER=thread ./test/olv_offline/run_tests.sh
          make -C test/olv_offline clean
          SANITIZER=address,undefined ./test/olv_offline/run_tests.sh

      - name: "Play statistics and diary"
        # the C (C89) PlayStats.dat and PlayDiary.dat are kept in and the
        # thread that counts the minutes played; plain, under TSan and under
        # ASan + UBSan
        run: |
          ./test/pdm/run_tests.sh
          make -C test/pdm clean
          SANITIZER=thread ./test/pdm/run_tests.sh
          make -C test/pdm clean
          SANITIZER=address,undefined ./test/pdm/run_tests.sh

      - name: "FST volume reads"
        # the C (C89) a volume's files are read and checked in: raw clusters
        # against the TMD's content hashes, right, wrong and of a size not a
        # whole number of blocks, from one reader and eight at once; plain,
        # under TSan and under ASan + UBSan
        run: |
          ./test/fst_volume/run_tests.sh
          make -C test/fst_volume clean
          SANITIZER=thread ./test/fst_volume/run_tests.sh
          make -C test/fst_volume clean
          SANITIZER=address,undefined ./test/fst_volume/run_tests.sh

      - name: "FST tables"
        # the C (C89) a volume's entries are looked up, listed and named in:
        # tables made right and made wrong, and made wrong at random, which
        # are turned away or walked to their end; plain and under ASan +
        # UBSan
        run: |
          ./test/fst_table/run_tests.sh
          make -C test/fst_table clean
          SANITIZER=address,undefined ./test/fst_table/run_tests.sh

      - name: "FST volumes"
        # the core's reader of disc and title content volumes: files from
        # unhashed and hashed clusters of a volume the test makes, through
        # the block cache and straight to where they go, with no allocation
        # once warm; plain, under ThreadSanitizer, under ASan + UBSan. The
        # core's precompiled header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/fst/run_tests.sh
          make -C test/fst clean
          SANITIZER=thread ./test/fst/run_tests.sh
          make -C test/fst clean
          SANITIZER=address,undefined ./test/fst/run_tests.sh

      - name: "IOSU kernel"
        # Message queues, timers and IPC from several threads at once, against
        # the kernel's own source; plain, under ThreadSanitizer, under ASan +
        # UBSan. The core's precompiled header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/iosu/run_tests.sh
          make -C test/iosu clean
          SANITIZER=thread ./test/iosu/run_tests.sh
          make -C test/iosu clean
          SANITIZER=address,undefined ./test/iosu/run_tests.sh

      - name: "Nothing left running at unload"
        # What the core stops before the frontend unloads it: a thread still
        # running wakes in unmapped code and crashes the frontend. Plain,
        # under ThreadSanitizer, under ASan + UBSan. The core's precompiled
        # header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/teardown/run_tests.sh
          make -C test/teardown clean
          SANITIZER=thread ./test/teardown/run_tests.sh
          make -C test/teardown clean
          SANITIZER=address,undefined ./test/teardown/run_tests.sh

      - name: "zlib and Zstandard"
        # libretro-common's deflate and rzstd in the core: zlib's own streams,
        # the console's zlib125 a byte at a time, standalone Cemu's shader
        # and pipeline cache entries, the graphic packs through the pack tool;
        # plain, under ThreadSanitizer, under ASan + UBSan. The core's
        # precompiled header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/compression/run_tests.sh
          make -C test/compression clean
          SANITIZER=thread ./test/compression/run_tests.sh
          make -C test/compression clean
          SANITIZER=address,undefined ./test/compression/run_tests.sh

      - name: "Shader/PSO gate"
        # What the shader path costs - each module of the compile corpus, the
        # file cache's load path - against test/pso/baseline.txt: worse
        # fails, and better fails until the baseline is updated with it
        # (AGENTS.md). The core's precompiled header wants fmt and glm, the
        # replayed draws' pipeline key the Vulkan headers.
        run: |
          git submodule update --init --depth 1 dependencies/cemu_graphic_packs dependencies/fmt dependencies/glm dependencies/Vulkan-Headers
          ./test/pso/run_tests.sh

      - name: "Shader compiler"
        # rslc, as the Vulkan renderer hands it GLSL: the core's own shaders,
        # the decompiler's shapes and every graphic pack shader it ships, each
        # module through spirv-val; plain, then under ASan + UBSan
        run: |
          git submodule update --init --depth 1 dependencies/cemu_graphic_packs
          sudo apt-get install -y spirv-tools
          ./test/shaders/run_tests.sh
          make -C test/shaders clean
          SANITIZER=address,undefined ./test/shaders/run_tests.sh

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    name: macos-${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Build"
        run: make -j $(sysctl -n hw.ncpu) platform=osx arch=${{ matrix.arch }}

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        with:
          name: parallel_gx2_libretro-macos-${{ matrix.arch }}
          path: ./parallel_gx2_libretro.dylib

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Set up MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make git mingw-w64-x86_64-gcc

      - name: "Build"
        run: make -j $(nproc)

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        with:
          name: parallel_gx2_libretro-windows-x64
          path: ./parallel_gx2_libretro.dll

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            platform: android-arm64
          - abi: x86_64
            platform: android-x86_64

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Build"
        # API level 28: bionic has aligned_alloc there, and C++20 wants it
        run: make -j $(nproc) platform=${{ matrix.platform }} ANDROID_API=28 NDK_ROOT=$ANDROID_NDK_LATEST_HOME

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        with:
          name: parallel_gx2_libretro-android-${{ matrix.abi }}
          path: ./parallel_gx2_libretro_android.so
