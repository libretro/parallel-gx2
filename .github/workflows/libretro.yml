name: Build libretro core

# Builds parallel_gx2_libretro with the Makefile for every target the core
# currently supports and uploads each result as an artifact, so a release
# can be assembled from them. The dependencies are submodules built with
# the core, so a job installs no libraries at all - not even GL or X11
# headers, as the context, surface and swapchain are the frontend's. Also
# runs the network layer's, the OpenGL GPU cothread's, the thread
# handoffs', the Wii U archive reader's and the shader compiler's tests.

on:
  push:
    branches:
      - libretro
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, comma-separated (linux, windows, android, macos), or all'
        type: string
        default: all

# Test builds can be limited to the platforms their testers use: the
# platforms input (workflow_dispatch) lists them. Pushes and "all" build
# everything.
jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Install dependencies"
        # the compiler, and nothing else
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends g++-12

      - name: "Build"
        run: make -j $(nproc) CC=gcc-12 CXX=g++-12

      - name: "No GL, EGL or X11 linked"
        # the context and every GL function are the frontend's
        run: ./tools/check_core_imports.sh parallel_gx2_libretro.so

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        with:
          name: parallel_gx2_libretro-linux-${{ matrix.arch }}
          path: ./parallel_gx2_libretro.so

  tests:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    name: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6

      - name: "No window-system code"
        # no X11/XCB/Wayland/GL/EGL header, VK_USE_PLATFORM_* or surface entry
        # point in the core: the frontend owns the context and the surface
        run: ./tools/check_no_wsi.sh

      - name: "Controllers updated once a frame"
        # from retro_run, after the frontend's input is polled: no input
        # thread waking every millisecond to update them
        run: ./tools/check_input_per_frame.sh

      - name: "GPU thread waits woken, not timed or spun"
        # an idle GPU thread sleeps until the CPU submits; the GPU thread's
        # start, the title start, the graphic packs, the GPU's init, GX2Init
        # and the IOSU services' threads sleep until notified, not by the
        # clock; nor is the pause gate a mutex any more; context_destroy's
        # waits for the GPU thread and the Audio Thread's empty pulls too;
        # the title scan, IOSU shutdown, SpotPass and nim waits as well;
        # and log.txt, the Vulkan queue lock and the motion and rumble
        # handoffs take no lock, nor AX's use of the audio devices, guest
        # time reads, the CPU's data cache flush reports, or the Vulkan
        # pipeline cache's compile threads, the worker queues or the shader
        # compile pool, nor the emulated controllers' reads; nor does the
        # nex thread poll
        run: ./tools/check_gpu_waits.sh

      - name: "curl_compat against local servers"
        # plain, then under AddressSanitizer + UBSan, then ThreadSanitizer
        run: |
          ./dependencies/curl-compat/test/run_tests.sh
          make -C dependencies/curl-compat/test clean
          SANITIZER=address,undefined ./dependencies/curl-compat/test/run_tests.sh
          make -C dependencies/curl-compat/test clean
          SANITIZER=thread ./dependencies/curl-compat/test/run_tests.sh

      - name: "OpenGL GPU cothread"
        # plain, then under AddressSanitizer + UBSan (ThreadSanitizer does
        # not follow stack switches)
        run: |
          ./test/gpu_cothread/run_tests.sh
          make -C test/gpu_cothread clean
          SANITIZER=address,undefined ./test/gpu_cothread/run_tests.sh

      - name: "Thread handoffs"
        # the recompiler's work queue, the GPU thread's wake, the audio
        # ring: plain, under ThreadSanitizer, under ASan + UBSan
        run: |
          ./test/handoff/run_tests.sh
          make -C test/handoff clean
          SANITIZER=thread ./test/handoff/run_tests.sh
          make -C test/handoff clean
          SANITIZER=address,undefined ./test/handoff/run_tests.sh

      - name: "Screen layouts and video views"
        # Both Screens' packing, the layout a frame is drawn with and the
        # views map that describes it: plain, then under ASan + UBSan
        run: |
          ./test/video_views/run_tests.sh
          make -C test/video_views clean
          SANITIZER=address,undefined ./test/video_views/run_tests.sh

      - name: "Wii U archives"
        # the core's .wua reader over libretro-common's zar, against archives
        # zar's writer makes: plain, under ThreadSanitizer, under ASan + UBSan.
        # The core's precompiled header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/zarchive/run_tests.sh
          make -C test/zarchive clean
          SANITIZER=thread ./test/zarchive/run_tests.sh
          make -C test/zarchive clean
          SANITIZER=address,undefined ./test/zarchive/run_tests.sh

      - name: "zlib and Zstandard"
        # libretro-common's deflate and rzstd in the core: zlib's own streams,
        # the console's zlib125 a byte at a time, standalone Cemu's shader
        # and pipeline cache entries, the graphic packs through the pack tool;
        # plain, under ThreadSanitizer, under ASan + UBSan. The core's
        # precompiled header wants fmt and glm.
        run: |
          git submodule update --init --depth 1 dependencies/fmt dependencies/glm
          ./test/compression/run_tests.sh
          make -C test/compression clean
          SANITIZER=thread ./test/compression/run_tests.sh
          make -C test/compression clean
          SANITIZER=address,undefined ./test/compression/run_tests.sh

      - name: "Shader compiler"
        # rslc, as the Vulkan renderer hands it GLSL: the core's own shaders,
        # the decompiler's shapes and every graphic pack shader it ships, each
        # module through spirv-val; plain, then under ASan + UBSan
        run: |
          git submodule update --init --depth 1 dependencies/cemu_graphic_packs
          sudo apt-get install -y spirv-tools
          ./test/shaders/run_tests.sh
          make -C test/shaders clean
          SANITIZER=address,undefined ./test/shaders/run_tests.sh

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    name: macos-${{ matrix.arch }}
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Build"
        run: make -j $(sysctl -n hw.ncpu) platform=osx arch=${{ matrix.arch }}

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        with:
          name: parallel_gx2_libretro-macos-${{ matrix.arch }}
          path: ./parallel_gx2_libretro.dylib

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Set up MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make git mingw-w64-x86_64-gcc

      - name: "Build"
        run: make -j $(nproc)

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        with:
          name: parallel_gx2_libretro-windows-x64
          path: ./parallel_gx2_libretro.dll

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            platform: android-arm64
          - abi: x86_64
            platform: android-x86_64

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Build"
        # API level 28: bionic has aligned_alloc there, and C++20 wants it
        run: make -j $(nproc) platform=${{ matrix.platform }} ANDROID_API=28 NDK_ROOT=$ANDROID_NDK_LATEST_HOME

      - name: "Upload artifact"
        uses: actions/upload-artifact@v6
        with:
          name: parallel_gx2_libretro-android-${{ matrix.abi }}
          path: ./parallel_gx2_libretro_android.so
